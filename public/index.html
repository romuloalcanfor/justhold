<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JustHold · Gráfico de cripto ao vivo</title>
<meta name="description" content="Gráfico de cripto ao vivo, com médias, régua e watchlist. Suas configurações salvas na sua conta.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="JustHold">
<meta property="og:url" content="https://justhold.ai/">
<meta property="og:title" content="JustHold · Gráfico de cripto ao vivo">
<meta property="og:description" content="Gráfico de cripto ao vivo, com médias, régua e watchlist. Suas configurações salvas na sua conta.">
<meta property="og:image" content="https://justhold.ai/img/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Homepage do JustHold: “Paciência é estratégia.” ao lado de um tabuleiro de xadrez">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://justhold.ai/img/preview.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@72,400&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="site.css">
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script>
<!-- o three.js é o arquivo mais pesado: começa a baixar já, em paralelo com o resto -->
<link rel="modulepreload" href="/vendor/three.module.min.js">
<link rel="modulepreload" href="/js/xadrez.js">
<link rel="modulepreload" href="/vendor/RoomEnvironment.js">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>
<header class="nav" id="nav">
  <a class="logo" href="/" aria-label="JustHold"><img src="img/logo.svg" alt="JustHold"></a>
  <span class="spacer"></span>
  <div id="lang"></div>
  <a class="btn uline sm nav-sim" href="/simulador/" data-i18n="nav.simulator">Simulador</a>
  <a class="btn uline sm nav-demo" href="/demo/" data-i18n="nav.demo">Demo</a>
  <div class="account" id="account">
    <a class="btn uline sm" href="/entrar/" data-i18n="nav.login">Entrar</a>
    <a class="btn ring sm" href="/grafico/" data-i18n="nav.openChart">Abrir o gráfico</a>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-text">
      <a class="pill" href="/grafico/" id="ticker"><span class="dot"></span>BTC/USDT <b id="tk-price">—</b> <span id="tk-chg"></span></a>
      <h1 data-i18n-html="home.title">Paciência<br>é estratégia.</h1>
    </div>
    <div class="board" id="board" aria-hidden="true"></div>
  </section>

  <!-- análise do mercado (publicada por scripts/analise.mjs); fica escondida até carregar -->
  <section class="section daily-wrap" id="daily" hidden aria-live="polite"></section>

  <section class="section closing">
    <h2 class="sr-only">Just hold.</h2>
    <div class="closing-row">
      <!-- Satoshi (quadros do vídeo): se revela com a rolagem e para no gesto de silêncio -->
      <div class="satoshi-quadros" id="satoshi"></div>
      <div class="closing-brand">
        <div id="logo-anim"></div>
        <div class="cta">
          <a class="btn ring" href="/grafico/" data-i18n="nav.openChart">Abrir o gráfico</a>
          <a class="btn uline" href="/entrar/?modo=criar" id="cta-signup-2" data-i18n="nav.signupFree">Criar conta grátis</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <img src="img/logo.svg" alt="JustHold">
  <span class="spacer"></span>
</footer>

<script type="module">
  import { me, logout } from './js/conta.js';
  import { mountLogo } from './js/logo-anim.js';
  import { t, locale, applyI18n, langSwitch } from './js/i18n.js';

  applyI18n();
  document.title = t('meta.homeTitle');
  document.querySelector('meta[name=description]').content = t('meta.homeDesc');
  document.getElementById('lang').replaceWith(langSwitch());

  // a logo do topo se escreve ao abrir; se algo falhar, volta a imagem normal
  const navLogo = document.querySelector('.nav .logo');
  mountLogo(navLogo, { loop: false, stroke: 2.4 }).catch(e => { console.error(e); navLogo.classList.add('fallback'); });
  mountLogo(document.getElementById('logo-anim')).catch(console.error);

  // o tabuleiro carrega à parte, para não segurar o resto da página
  import('./js/xadrez.js').then(m => m.mountChess(document.getElementById('board'))).catch(console.error);
  // análise do dia, logo abaixo do título
  import('./js/analise-home.js').then(m => m.mountDaily(document.getElementById('daily'))).catch(console.error);
  // o Satoshi só baixa as imagens quando a pessoa rola até perto dele
  import('./js/satoshi-quadros.js').then(m => m.mountSatoshiQuadros(document.getElementById('satoshi'))).catch(console.error);

  const nav = document.getElementById('nav');
  addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 8), { passive: true });

  // Logado: troca "Entrar" pelo e-mail e um botão de sair; some o "Criar conta".
  me().then(user => {
    if (!user) return;
    const acc = document.getElementById('account');
    const out = Object.assign(document.createElement('button'), { className: 'btn uline sm', textContent: t('nav.logout') });
    out.onclick = async () => { await logout(); location.reload(); };
    const who = Object.assign(document.createElement('span'), { textContent: user.email });
    who.style.color = 'var(--muted)';
    acc.replaceChildren(who, out, Object.assign(document.createElement('a'), { className: 'btn ring sm', href: '/grafico/', textContent: t('nav.openChart') }));
    document.getElementById('cta-signup-2')?.remove();
  });

  // Preço do BTC ao vivo na pílula acima do título.
  const price = document.getElementById('tk-price'), chg = document.getElementById('tk-chg');
  const fmt = new Intl.NumberFormat(locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const show = (c, o) => {
    price.textContent = fmt.format(c);
    const p = ((c - o) / o) * 100;
    chg.textContent = `${p >= 0 ? '+' : '−'}${fmt.format(Math.abs(p))}%`;
    chg.className = p >= 0 ? 'up' : 'down';
  };
  // data-stream.binance.vision é o endereço só de dados públicos (abre também onde a Binance é
  // bloqueada, como nos EUA); se falhar, tenta o principal.
  const STREAMS = ['wss://data-stream.binance.vision', 'wss://stream.binance.com:9443'];
  (function connect(i = 0) {
    const ws = new WebSocket(`${STREAMS[i % STREAMS.length]}/ws/btcusdt@miniTicker`);
    let got = false;
    ws.onmessage = e => { got = true; const d = JSON.parse(e.data); show(+d.c, +d.o); };
    ws.onclose = () => setTimeout(() => connect(got ? i : i + 1), got ? 5000 : 1000);
  })();
</script>
</body>
</html>
